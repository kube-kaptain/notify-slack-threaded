# Slack threaded notify configuration for a Kaptain environment.
#
# Only for those building their own image with the notify scripts built in and
# supplying their own ConfigMap and Secret. The notify layer writes these keys
# for you, with tokens in the right format, so most people never need this.
#
# The token references here, such as ${Category/Name}, use shell style
# delimiters and PascalCase names. If you supply this file yourself they must
# match your env project's TOKEN_DELIMITER_STYLE and TOKEN_NAME_STYLE.
#
# Replaces the ConfigMap the env build generates, so it keeps the generated
# project-name key. Supply the tokens. The keys end up as files under
# NOTIFY_CONFIG_BASE. The bot token goes in the Secret, see
# templates/env-secret/secret.template.yaml.
#
# Optional keys are commented out. Leave them out for the default. Present but
# empty means off, for the prefixes, reactions, mention and DM wording.
apiVersion: v1
kind: ConfigMap
metadata:
  name: run-replaceme-configmap-checksum
data:
  # Generated by the env build when it makes this ConfigMap, kept here
  project-name: "${ProjectName}"

  # Required
  slackContext: "deploy"
  slackChannelId: "${NotifySlackThreaded/ChannelId}"
  slackAlertChannelId: "${NotifySlackThreaded/AlertChannelId}"

  # Who to DM, user IDs (U0...) separated by commas and/or spaces
  # slackFailureUserIds: "${NotifySlackThreaded/FailureUserIds}"
  # slackAlertUserIds: "${NotifySlackThreaded/AlertUserIds}"

  # 'true' makes Slack validation failures stop the deploy, default false
  # slackRequired: "${NotifySlackThreaded/Required}"

  # Post under another name and icon, needs chat:write.customize
  # slackUsername: "${NotifySlackThreaded/Username}"
  # slackIconEmoji: "${NotifySlackThreaded/IconEmoji}"
  # slackIconUrl: "${NotifySlackThreaded/IconUrl}"

  # Days of history searched to rejoin a thread, default 30
  # slackThreadLookbackDays: "${NotifySlackThreaded/ThreadLookbackDays}"

  # Mention at the start of alert posts, default <!here>
  # slackAlertMention: "${NotifySlackThreaded/AlertMention}"

  # Text before each message, defaults: none, :warning:, :rotating_light:,
  # :white_check_mark:, :x:, :rotating_light:
  # slackInfoPrefix: "${NotifySlackThreaded/InfoPrefix}"
  # slackWarningPrefix: "${NotifySlackThreaded/WarningPrefix}"
  # slackErrorPrefix: "${NotifySlackThreaded/ErrorPrefix}"
  # slackSuccessPrefix: "${NotifySlackThreaded/SuccessPrefix}"
  # slackFailurePrefix: "${NotifySlackThreaded/FailurePrefix}"
  # slackAlertPrefix: "${NotifySlackThreaded/AlertPrefix}"

  # Reaction on the thread's first post, defaults warning, white_check_mark and x
  # slackWarningReaction: "${NotifySlackThreaded/WarningReaction}"
  # slackSuccessReaction: "${NotifySlackThreaded/SuccessReaction}"
  # slackFailureReaction: "${NotifySlackThreaded/FailureReaction}"

  # curl retry and timeouts in seconds, defaults 3, 2, 10, 20, 70
  # slackCurlRetry: "${NotifySlackThreaded/CurlRetry}"
  # slackCurlRetryDelay: "${NotifySlackThreaded/CurlRetryDelay}"
  # slackCurlConnectTimeout: "${NotifySlackThreaded/CurlConnectTimeout}"
  # slackCurlMaxTime: "${NotifySlackThreaded/CurlMaxTime}"
  # slackCurlRetryMaxTime: "${NotifySlackThreaded/CurlRetryMaxTime}"

  # DM wording, {user} mentions the recipient, {ENV_VAR} inserts its value
  # slackFailureDmLeader: "${NotifySlackThreaded/FailureDmLeader}"
  # slackFailureLinkLabel: "${NotifySlackThreaded/FailureLinkLabel}"
  # slackAlertDmLeader: "${NotifySlackThreaded/AlertDmLeader}"
  # slackAlertLinkLabel: "${NotifySlackThreaded/AlertLinkLabel}"
