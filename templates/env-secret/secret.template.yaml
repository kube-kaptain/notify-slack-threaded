# Slack threaded notify bot token for a Kaptain environment.
#
# Only for those building their own image with the notify scripts built in and
# supplying their own ConfigMap and Secret. The notify layer writes these keys
# for you, with tokens in the right format, so most people never need this.
#
# The token references here, such as ${Category/Name}, use shell style
# delimiters and PascalCase names. If you supply this file yourself they must
# match your env project's TOKEN_DELIMITER_STYLE and TOKEN_NAME_STYLE.
#
# Replaces the Secret the env build generates, so it keeps the generated
# environmentPassphrase key, which the env build requires. Supply the tokens.
# The keys end up as files under NOTIFY_SECRETS_BASE. Everything else is in
# templates/env-configmap/configmap.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: run-replaceme-secret-checksum
type: Opaque
stringData:
  # Generated by the env build when it makes this Secret, kept here
  environmentPassphrase: "${RunReplaceme/EnvironmentPassphrase}"

  # Bot User OAuth Token from the Slack app, xoxb-...
  slackBotToken: "${NotifySlackThreaded/BotToken}"
