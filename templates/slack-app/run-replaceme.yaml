display_information:
  name: Run Replaceme
  description: Kaptain deployment notifications
features:
  bot_user:
    display_name: Run Replaceme
    always_online: false
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: true
oauth_config:
  scopes:
    bot:
      - channels:history
      - chat:write
      - groups:history
      - reactions:write
settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
